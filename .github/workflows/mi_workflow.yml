name: Mi Primer Workflow CI/CD - Entregable 1 # 1. Nombre descriptivo del workflow

on:
  push: # 2. Evento al subir cambios: push
    branches:
      - main
  workflow_dispatch: # 2b. Evento de ejecución manual: workflow_dispatch

permissions:
  contents: read

jobs:
  imprimir_info: # No cambies este nombre, lo usaremos para evaluar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7 # Este paso clona tu repositorio. No lo modifiques.

      - name: Imprimir Mensaje Personalizado
        shell: bash
        run: |
          echo "Hola, soy José Miguel Blanco Vélez y este es mi primer workflow!"
          echo "La fecha y hora actual es: $(date)"

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ejecutar script Python
        run: python mi_script.py
